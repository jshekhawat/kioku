[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kioku"
version = "0.1.0"
description = "Locally hosted agent memory service (mem0/supermemory style) with OpenRouter, Ollama, Qdrant and a knowledge graph."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "qdrant-client>=1.10,<2",
    "falkordb>=1.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
